<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 - Завдання 5</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <div class="page-container">
        <h1 class="task-title">Завдання 5 — Відтворення картки погоди</h1>
        
        <div class="weather-widget">

            <div class="nav-arrows">
                <button class="arrow-btn" aria-label="Назад">&larr;</button>
                <button class="arrow-btn" aria-label="Вперед">&rarr;</button>
            </div>

            <div class="main-card">
                <div class="current-temp">17</div>
            </div>

            <div class="cloud-container">
                <svg class="cloud-icon" viewBox="0 0 100 60" preserveAspectRatio="none">
                    <path d="M 20 45 
                             A 15 15 0 0 1 20 15 
                             A 20 20 0 0 1 55 10 
                             A 18 18 0 0 1 85 25 
                             A 15 15 0 0 1 80 45 
                             Z" fill="url(#cloud-grad)" />
                    <defs>
                        <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                            <stop offset="100%" stop-color="#cfd9df" stop-opacity="0.8" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <div class="forecast-card">
                <div class="forecast-day">
                    <span class="day-name">Mon</span>
                    <span class="day-temp">17&deg;</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Tue</span>
                    <span class="day-temp">19&deg;</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Wed</span>
                    <span class="day-temp">16&deg;</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Thu</span>
                    <span class="day-temp">18&deg;</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Fri</span>
                    <span class="day-temp">21&deg;</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
