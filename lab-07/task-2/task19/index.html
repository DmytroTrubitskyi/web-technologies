<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlexBox Nav</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="cover">
    <video class="dog" src="Coverr-Lulu.webm" autoplay muted loop playsinline aria-hidden="true"></video>

    <form  class="flex-form">
      
      <input type="search" name="destination" placeholder="Where do you want to go?" aria-label="Destination">
      
      <label for="from">From</label>
      <input type="date" id="from" name="from">

      <label for="to">To</label>
      <input type="date" id="to" name="to">

      <select name="guests" id="guests" aria-label="Number of guests">
        <option value="1">1 Guest</option>
        <option value="2">2 Guest</option>
        <option value="3">3 Guest</option>
        <option value="4">4 Guest</option>
        <option value="5">5 Guest</option>
      </select>

      <input type="submit" value="Search">

    </form>

  </div>

</body>
</html>
