<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1: Таблиця</title>
    <style type="text/css">
       table { border-collapse: collapse; width: 400px; }
       td { border: 5px solid #000; }
       tr { width: 60px; height: 60px; }
    </style>
</head>
<body>

    <center>
        <h2>Завдання 1</h2>

        <table>
            <!-- Рядок 1 -->
            <tr>
                <td colspan="8" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 2 -->
            <tr>
                <td rowspan="6" bgcolor="#FFFDF0"></td>
                <td colspan="6" bgcolor="#17EAD9"></td>
                <td rowspan="6" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 3 -->
            <tr>
                <td rowspan="4" bgcolor="#FFFDF0"></td>
                <td colspan="4" bgcolor="#17EAD9"></td>
                <td rowspan="4" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 4 -->
            <tr>
                <td rowspan="2" bgcolor="#FFFDF0"></td>
                <td bgcolor="#FF0000"></td>
                <td bgcolor="#0000FF"></td>
                <td rowspan="2" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 5 -->
            <tr>
                <td bgcolor="#00FF00"></td>
                <td bgcolor="#FFFF00"></td>
            </tr>
            <!-- Рядок 6 -->
            <tr>
                <td colspan="4" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 7 -->
            <tr>
                <td colspan="6" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 8 -->
            <tr>
                <td colspan="8" bgcolor="#17EAD9"></td>
            </tr>
        </table>

        <br><br>
        <a href="../index.html">Повернутись на головну</a>
    </center>

</body>
</html>
