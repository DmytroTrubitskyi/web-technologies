<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1: Таблиця</title>
</head>
<body>

    <center>
        <h2>Завдання 1</h2>

        <table border="2" cellspacing="0" cellpadding="0" width="360" height="360">
            <!-- Рядок 1 -->
            <tr height="40">
                <td colspan="8" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 2 -->
            <tr height="40">
                <td rowspan="6" width="40" bgcolor="#FFFDF0"></td>
                <td colspan="6" bgcolor="#17EAD9"></td>
                <td rowspan="6" width="40" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 3 -->
            <tr height="40">
                <td rowspan="4" width="40" bgcolor="#FFFDF0"></td>
                <td colspan="4" bgcolor="#17EAD9"></td>
                <td rowspan="4" width="40" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 4 -->
            <tr height="40">
                <td rowspan="2" width="40" bgcolor="#FFFDF0"></td>
                <td width="40" bgcolor="#FF0000"></td>
                <td width="40" bgcolor="#0000FF"></td>
                <td rowspan="2" width="40" bgcolor="#FFFDF0"></td>
            </tr>
            <!-- Рядок 5 -->
            <tr height="40">
                <td width="40" bgcolor="#00FF00"></td>
                <td width="40" bgcolor="#FFFF00"></td>
            </tr>
            <!-- Рядок 6 -->
            <tr height="40">
                <td colspan="4" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 7 -->
            <tr height="40">
                <td colspan="6" bgcolor="#17EAD9"></td>
            </tr>
            <!-- Рядок 8 -->
            <tr height="40">
                <td colspan="8" bgcolor="#17EAD9"></td>
            </tr>
        </table>

        <br><br>
        <a href="../index.html">Повернутись на головну</a>
    </center>

</body>
</html>
