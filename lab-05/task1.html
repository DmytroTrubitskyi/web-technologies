<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Дворівневий список</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <h1 class="heading-primary">План подорожі:</h1>
        
        <ul class="list-primary">
            <li class="item-primary">
                <span class="badge-accent text-bolded">Підготовчий етап</span>
                <ul class="list-secondary">
                    <li class="item-secondary icon-route"><span class="badge-sub text-italicized">Обрати маршрут</span></li>
                    <li class="item-secondary icon-flight"><span class="badge-sub text-italicized">Квитки на літак</span></li>
                    <li class="item-secondary icon-hotel"><span class="badge-sub text-italicized">Готель</span></li>
                    <li class="item-secondary icon-car"><span class="badge-sub text-italicized">Оренда авто</span></li>
                </ul>
            </li>
            
            <li class="item-primary">
                <span class="badge-accent text-bolded">Відпочинок</span>
                <ul class="list-secondary">
                    <li class="item-secondary icon-bar"><span class="badge-sub text-italicized">Бари</span></li>
                    <li class="item-secondary icon-casino"><span class="badge-sub text-italicized">Казино</span></li>
                    <li class="item-secondary icon-museum"><span class="badge-sub text-italicized">Музеї</span></li>
                    <li class="item-secondary icon-festival"><span class="badge-sub text-italicized">Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>

</body>
</html>
